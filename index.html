<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小爱音乐台 · 在线点歌</title>
<style>
:root{
  --red:#ec4141;--red-d:#d93b3b;--bg:#fff;--bg2:#f7f8fa;--bg3:#f0f1f4;
  --line:#e8e9ed;--txt:#333;--txt2:#666;--txt3:#a8abb3;--shadow:0 8px 32px rgba(0,0,0,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt);background:var(--bg);overflow:hidden;font-size:14px}
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:64px 1fr 84px;height:100vh;width:100vw;overflow:hidden}
.icon{width:18px;height:18px;fill:currentColor;flex:none;vertical-align:middle}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ============ 顶部栏 ============ */
.top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid var(--line);background:#fff;z-index:5}
.logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;color:var(--red);letter-spacing:.5px;user-select:none}
.logo .disc{width:30px;height:30px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;flex:none}
.logo .disc::after{content:"";width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.nav-arrows{display:flex;gap:6px;margin-left:8px}
.menu-btn{display:none;width:32px;height:32px;border-radius:8px;background:var(--bg3);align-items:center;justify-content:center;color:var(--txt2);flex:none;margin-right:4px;font-size:16px}
.menu-btn:hover{background:#e4e6ea}
.side-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:190}
.side-mask.show{display:block}
.nav-arrows button{width:28px;height:28px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--txt2)}
.nav-arrows button:hover{background:#e4e6ea}
.search{margin-left:auto;width:230px;height:34px;background:var(--bg3);border-radius:18px;display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--txt3)}
.search input{border:0;background:none;outline:0;width:100%;font-size:13px;color:var(--txt)}
.search input::placeholder{color:var(--txt3)}
.spk-badge{display:flex;align-items:center;gap:6px;font-size:12px;color:#1a9c6b;background:#eafaf2;padding:6px 11px;border-radius:14px;font-weight:600}
.spk-badge .dot{width:7px;height:7px;border-radius:50%;background:#1ac583}

/* ============ 添加歌单 ============ */
.btn-add{display:flex;align-items:center;gap:5px;height:34px;padding:0 14px;border-radius:17px;border:1px solid #f2c2c2;background:#fff6f6;color:var(--red);font-size:13px;font-weight:600;flex:none;white-space:nowrap}
.btn-add:hover{background:#ffecec;border-color:var(--red)}
.btn-add .plus{font-size:15px;line-height:1;margin-top:-1px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:200}
.modal.show{display:flex}
.modal-card{width:540px;max-width:92vw;background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.modal-h{padding:20px 24px 15px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.modal-h .x{margin-left:auto;color:var(--txt3);font-size:22px;width:30px;height:30px;border-radius:50%;line-height:1}
.modal-h .x:hover{background:var(--bg3)}
.modal-b{padding:20px 24px 24px}
.modal-b .tip{font-size:12.5px;color:var(--txt3);line-height:1.85;margin-bottom:14px}
.modal-b input[type=text]{width:100%;height:42px;border:1px solid var(--line);border-radius:8px;padding:0 13px;font-size:13.5px;outline:0;font-family:inherit;color:var(--txt)}
.modal-b input[type=text]:focus{border-color:var(--red)}
.modal-b .row{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.btn-primary{background:var(--red);color:#fff;height:38px;padding:0 24px;border-radius:19px;font-size:13.5px;font-weight:600}
.btn-primary:hover{background:var(--red-d)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed}
.btn-ghost{height:38px;padding:0 18px;border-radius:19px;border:1px solid var(--line);color:var(--txt2);font-size:13.5px;background:#fff}
.btn-ghost:hover{background:var(--bg2)}
.import-progress{margin-top:18px;display:none}
.import-progress.show{display:block}
.import-progress .st{font-size:12.5px;color:var(--txt2);margin-bottom:9px;line-height:1.6}
.import-progress .pbar{height:6px;background:#eef0f3;border-radius:3px;overflow:hidden}
.import-progress .pbar i{display:block;height:100%;width:0;background:var(--red);border-radius:3px;transition:width .35s}
.import-result{margin-top:16px;font-size:13px;line-height:1.9;display:none;border-top:1px dashed var(--line);padding-top:14px}
.import-result.show{display:block}
.import-result .ok{color:#1a9c6b;font-weight:700;margin-bottom:4px}
.import-result .bad{color:#c0392b;font-weight:600;margin-top:8px}
.import-result .fail-list{max-height:110px;overflow-y:auto;font-size:12px;color:var(--txt3);margin-top:4px;line-height:1.7}

/* ============ 左侧栏 ============ */
.side{background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:16px 0 20px}
.side::-webkit-scrollbar,.main::-webkit-scrollbar{width:6px}
.side::-webkit-scrollbar-thumb,.main::-webkit-scrollbar-thumb{background:#d5d7dd;border-radius:3px}
.side-sec{margin-bottom:18px}
.side-title{font-size:11px;color:var(--txt3);padding:0 22px;margin-bottom:8px;letter-spacing:1px;font-weight:600}
.side-item{display:flex;align-items:center;gap:11px;height:40px;padding:0 22px;color:var(--txt2);cursor:pointer;font-size:13.5px;border-left:3px solid transparent;user-select:none}
.side-item:hover{background:var(--bg3)}
.side-item.active{background:#fdecec;color:var(--red);border-left-color:var(--red);font-weight:600}
.side-item .pl-ico{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,#ff9a9e,#fecfef);flex:none}
.side-item .cnt{margin-left:auto;font-size:11px;color:var(--txt3)}

/* ============ 主区 ============ */
.main{overflow-y:auto;background:#fff;position:relative;min-height:0}
.detail{padding:36px 44px 20px}
.pl-head{display:flex;gap:28px;align-items:flex-end;margin-bottom:26px}
.cover{width:200px;height:200px;border-radius:10px;background:linear-gradient(145deg,#f0c2c5,#e8a0a6);box-shadow:0 6px 20px rgba(0,0,0,.12);flex:none;object-fit:cover;border:1px solid #eee}
.pl-info{flex:1;min-width:0;padding-bottom:4px}
.pl-tag{display:inline-block;font-size:11px;color:var(--red);border:1px solid var(--red);border-radius:3px;padding:1px 6px;margin-bottom:10px}
.pl-name{font-size:30px;font-weight:700;margin-bottom:14px;line-height:1.25}
.pl-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--txt3);margin-bottom:20px}
.pl-meta b{color:var(--txt2);font-weight:600}
.pl-actions{display:flex;align-items:center;gap:12px}
.btn-play{display:flex;align-items:center;gap:8px;background:var(--red);color:#fff;height:40px;padding:0 24px;border-radius:20px;font-size:14px;font-weight:600;box-shadow:0 4px 12px rgba(236,65,65,.3)}
.btn-play:hover{background:var(--red-d)}
.btn-round{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--txt2);background:#fff}
.btn-round:hover{border-color:var(--red);color:var(--red)}
.btn-round.on{color:var(--red);border-color:#f5c0c0;background:#fff5f5}

/* 歌曲表格 */
.tracks{padding:0 44px 40px}
.tracks-head,.track{display:grid;grid-template-columns:56px 1fr 150px 80px;align-items:center;gap:8px}
.tracks-head{height:34px;border-bottom:1px solid var(--line);font-size:12px;color:var(--txt3);padding:0 12px}
.track{height:46px;padding:0 12px;border-radius:6px;cursor:pointer;font-size:13px;position:relative}
.track:nth-child(odd){background:#fafbfc}
.track:hover{background:#f2f3f5}
.track.playing{background:#fdeeee;color:var(--red)}
.track .idx{color:var(--txt3);display:flex;align-items:center;gap:4px;font-size:12px}
.track.playing .idx{color:var(--red)}
.track .tname{display:flex;align-items:center;gap:9px;min-width:0;font-weight:500}
.track .tname .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track .tname .sq{font-size:10px;color:#e8953a;border:1px solid #f0b87a;border-radius:2px;padding:0 3px;flex:none}
.track.playing .tname .sq{border-color:#e88}
.track .artist,.track .dur{color:var(--txt3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:13px;width:14px}
.eq i{width:2px;background:var(--red);border-radius:1px;animation:eq .9s ease-in-out infinite alternate}
.eq i:nth-child(1){height:6px;animation-delay:0s}.eq i:nth-child(2){height:12px;animation-delay:.3s}.eq i:nth-child(3){height:8px;animation-delay:.6s}
@keyframes eq{from{height:3px}to{height:12px}}

/* ============ 底部播放条 ============ */
.bar{grid-column:1/3;display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:center;gap:20px;padding:0 24px;border-top:1px solid var(--line);background:#fff;z-index:6;box-shadow:0 -2px 12px rgba(0,0,0,.03)}
.bar-left{display:flex;align-items:center;gap:12px;min-width:0}
.bar-cover{width:50px;height:50px;border-radius:7px;background:linear-gradient(145deg,#f0c2c5,#e8a0a6);flex:none;object-fit:cover;border:1px solid #eee}
.bar-song{min-width:0}
.bar-song .n{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
.bar-song .a{font-size:12px;color:var(--txt3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-heart{margin-left:6px;color:var(--txt3)}
.bar-heart.on{color:var(--red)}
.bar-mid{display:flex;flex-direction:column;align-items:center;gap:7px}
.ctrls{display:flex;align-items:center;gap:22px}
.ctrls button{color:var(--txt2);display:flex;align-items:center;justify-content:center}
.ctrls button:hover{color:var(--red)}
.ctrls .play-main{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff}
.ctrls .play-main:hover{background:var(--red-d);color:#fff}
.prog{display:flex;align-items:center;gap:10px;width:100%;font-size:11px;color:var(--txt3);font-variant-numeric:tabular-nums}
.prog .track-bar{flex:1;height:16px;position:relative;cursor:pointer;display:flex;align-items:center}
.prog .track-bar::before{content:"";position:absolute;left:0;right:0;height:4px;background:#e5e6ea;border-radius:2px}
.prog .fill{height:4px;background:var(--red);border-radius:2px;width:0;position:relative;z-index:1}
.prog .fill::after{content:"";position:absolute;right:-5px;top:-3px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--red);opacity:0;transition:opacity .15s}
.prog .track-bar:hover .fill::after{opacity:1}
.bar-right{display:flex;align-items:center;justify-content:flex-end;gap:16px;color:var(--txt2)}
.mode-btn{display:flex;align-items:center;gap:5px;font-size:12px;padding:6px;border-radius:6px}
.mode-btn:hover{background:var(--bg3)}
.mode-btn .mname{color:var(--txt3)}
.vol{display:flex;align-items:center;gap:8px}
.vol input{width:84px;accent-color:var(--red);cursor:pointer}
.list-btn{display:flex;align-items:center}

/* 播放列表抽屉 */
.drawer{position:fixed;top:64px;right:0;bottom:84px;width:360px;background:#fff;box-shadow:var(--shadow);z-index:20;transform:translateX(100%);transition:transform .28s ease;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer.open{transform:translateX(0)}
.drawer-h{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.drawer-h h3{font-size:16px}
.drawer-h .sub{font-size:12px;color:var(--txt3);margin-left:10px;font-weight:400}
.drawer-h .x{margin-left:auto;color:var(--txt3);font-size:20px;width:28px;height:28px;border-radius:50%}
.drawer-h .x:hover{background:var(--bg3)}
.drawer-list{overflow-y:auto;flex:1;padding:8px 0}
.ditem{display:flex;align-items:center;gap:10px;height:44px;padding:0 22px;cursor:pointer;font-size:13px}
.ditem:hover{background:var(--bg2)}
.ditem.playing{color:var(--red);background:#fdeeee}
.ditem .dn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.ditem .dd{color:var(--txt3);font-size:11px}

/* 提示 */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-10px);background:rgba(40,40,45,.94);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:50;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{display:flex;align-items:center;justify-content:center;height:300px;color:var(--txt3);flex-direction:column;gap:14px}
.offline{position:fixed;inset:0;background:#f7f8fa;display:none;align-items:center;justify-content:center;z-index:100}
.offline.show{display:flex}
.offline .card{text-align:center;line-height:2;color:var(--txt2)}
.offline code{background:#e8e9ed;padding:3px 8px;border-radius:5px;font-size:13px;color:var(--red)}
/* 发现音乐 */
.discover-view{display:none;padding:26px 32px 44px}
.discover-view.show{display:block}
.dv-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;gap:16px}
.dv-title{font-size:24px;font-weight:700;letter-spacing:-.3px}
.dv-sub{font-size:12.5px;color:var(--txt3);margin-top:7px;line-height:1.6}
.dv-refresh{height:30px;padding:0 15px;border-radius:15px;border:1px solid var(--line);background:#fff;color:var(--txt2);font-size:12.5px;flex:none}
.dv-refresh:hover{border-color:#d5d7dd;color:var(--txt)}
.dv-cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.dv-cat{height:28px;padding:0 14px;border-radius:14px;background:#f2f3f5;color:var(--txt2);font-size:12.5px;display:flex;align-items:center;cursor:pointer;user-select:none}
.dv-cat:hover{background:#e8e9ed}
.dv-cat.on{background:var(--red);color:#fff}
.dv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:20px 18px}
.dv-card{cursor:pointer;position:relative}
.dv-cover{position:relative;width:100%;padding-top:100%;border-radius:10px;overflow:hidden;background:#f0f1f4}
.dv-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .45s}
.dv-card:hover .dv-cover img{transform:scale(1.06)}
.dv-cover .ply{position:absolute;right:9px;bottom:9px;width:31px;height:31px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;opacity:0;transition:opacity .2s}
.dv-card:hover .ply{opacity:1}
.dv-name{font-size:13px;line-height:1.5;margin-top:9px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:39px;color:var(--txt)}
.dv-meta{font-size:11.5px;color:var(--txt3);margin-top:4px}
.dv-card.loading .dv-cover::after{content:'准备中…';position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;z-index:2}
.dv-empty{padding:36px 0;color:var(--txt3);font-size:13px;line-height:1.9}
@media(max-width:900px){
  .app{grid-template-columns:0 1fr}
  .side{display:block;position:fixed;left:0;top:0;bottom:0;width:238px;z-index:200;transform:translateX(-101%);transition:transform .22s ease;box-shadow:2px 0 18px rgba(0,0,0,.12)}
  .side.open{transform:none}
  .menu-btn{display:flex}
  .nav-arrows{display:none}
  .detail,.tracks{padding-left:20px;padding-right:20px}
  .bar{grid-template-columns:1fr 1.4fr 1fr;padding:0 12px;gap:10px}
  .bar-left .bar-song{max-width:120px}
  .spk-badge span:last-child{display:none}
}
@media(max-width:900px){.discover-view{padding:18px 20px 40px}.dv-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:16px 12px}.dv-title{font-size:20px}}
</style>
</head>
<body>
<div class="offline" id="offline"><div class="card">
  <div style="font-size:40px;margin-bottom:8px">🎵</div>
  <div style="font-size:18px;color:#333;font-weight:600">连不上小爱音乐服务</div>
  <div>请确认本机「打开小爱音箱」服务和桥接服务在运行，再刷新本页</div>
  <div style="font-size:12px;color:#999">或访问 <code id="offurl"></code></div>
</div></div>

<div class="app">
  <div class="side-mask" id="sideMask"></div>
  <!-- 顶部 -->
  <div class="top">
    <button class="menu-btn" id="btnMenu" title="歌单列表">☰</button>
    <div class="logo"><span class="disc"></span>小爱音乐台</div>
    <div class="nav-arrows"><button title="后退">‹</button><button title="前进">›</button></div>
    <div class="search"><svg class="icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><input id="search" placeholder="搜索当前歌单 / 发现页搜歌单"></div>
    <button class="btn-add" id="btnAddPl" title="粘贴网易云歌单链接，自动下载并加入左侧歌单"><span class="plus">＋</span>添加歌单</button>
    <div class="spk-badge"><span class="dot"></span><span id="spkName">小爱音箱</span></div>
    <button id="btnBridge" title="点击修改本机桥接地址" style="font-size:11px;color:#888;background:#f0f1f4;padding:5px 10px;border-radius:12px">本机连接</button>
  </div>

  <!-- 左侧 -->
  <aside class="side">
    <div class="side-sec">
      <div class="side-title">推荐</div>
      <div class="side-item active" id="navDiscover" data-view="discover"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>发现音乐</div>
    </div>
    <div class="side-sec">
      <div class="side-title">我的歌单</div>
      <div id="sidePlaylists"></div>
    </div>
    <div class="side-sec" id="sideDiscoverSec" style="display:none">
      <div class="side-title">最近发现</div>
      <div id="sideDiscover"></div>
    </div>
  </aside>

  <!-- 主内容 -->
  <main class="main" id="main">
    <div class="discover-view" id="discoverView">
      <div class="dv-head">
        <div>
          <div class="dv-title">发现音乐</div>
          <div class="dv-sub" id="dvSub">正在加载热门歌单…</div>
        </div>
        <button class="dv-refresh" id="dvRefresh">换一批</button>
      </div>
      <div class="dv-cats" id="dvCats"></div>
      <div class="dv-grid" id="dvGrid"></div>
      <div class="dv-empty" id="dvEmpty" style="display:none"></div>
    </div>
    <div class="detail">
      <div class="pl-head">
        <img class="cover" id="plCover" alt="封面">
        <div class="pl-info">
          <span class="pl-tag">歌单</span>
          <div class="pl-name" id="plName">加载中…</div>
          <div class="pl-meta"><b id="plOwner">小爱音乐台</b><span id="plCount"></span></div>
          <div class="pl-actions">
            <button class="btn-play" id="btnPlayAll"><svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>播放全部</button>
          </div>
        </div>
      </div>
    </div>
    <div class="tracks">
      <div class="tracks-head"><span>#</span><span>音乐标题</span><span>歌手</span><span>时长</span></div>
      <div id="trackList"></div>
    </div>
  </main>

  <!-- 底部播放条 -->
  <div class="bar">
    <div class="bar-left">
      <img class="bar-cover" id="barCover" alt="">
      <div class="bar-song"><div class="n" id="barTitle">未在播放</div><div class="a" id="barArtist">选一首歌开始吧</div></div>
      <button class="bar-heart" id="btnHeart" title="收藏"><svg class="icon" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg></button>
    </div>

      <div class="ctrls">
        <button id="btnPrev" title="上一首"><svg class="icon" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
        <button class="play-main" id="btnToggle" title="播放/暂停"><svg class="icon" id="icoPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <button id="btnNext" title="下一首"><svg class="icon" viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>

    <div class="bar-right">
      <button class="mode-btn" id="btnMode" title="播放模式"><svg class="icon" id="icoMode" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg><span class="mname" id="modeName">顺序播放</span></button>
      <div class="vol"><svg class="icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg><input type="range" id="vol" min="0" max="100" value="50"></div>
      <button class="list-btn" id="btnList" title="播放列表"><svg class="icon" viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg></button>

<!-- 播放列表抽屉 -->
<div class="drawer" id="drawer">
  <div class="drawer-h"><h3>播放列表</h3><span class="sub" id="drawerSub"></span><button class="x" id="btnCloseDrawer">×</button></div>
  <div class="drawer-list" id="drawerList"></div>
</div>

<!-- 添加歌单弹窗 -->
<div class="modal" id="addModal">
  <div class="modal-card">

      <span>添加网易云歌单</span>

        把网易云歌单链接粘进来（浏览器地址栏复制即可）。<br>
        会自动下载歌曲到本机 Music 文件夹，并加到左侧「我的歌单」。
      </div>
      <input type="text" id="addUrl" placeholder="https://music.163.com/playlist?id=18546163449" spellcheck="false">
      <div class="row">
        <button class="btn-ghost" id="addCancel">取消</button>
        <button class="btn-primary" id="addGo">开始导入</button>

        <div class="st" id="progStage">准备中…</div>
        <div class="pbar"><i id="impFill"></i></div>

      <div class="import-result" id="importRes"></div>
    </div>
  </div>

<script>
/* ============ 基础：token / API ============ */
var qs=new URLSearchParams(location.search);
// 本机桥接地址：默认 localhost:58092，可用 ?bridge=http://192.168.x.x:58092 覆盖并记忆
var BRIDGE=qs.get('bridge')||localStorage.getItem('xiaomi_bridge')||'http://localhost:58092';
if(qs.get('bridge')){try{localStorage.setItem('xiaomi_bridge',BRIDGE)}catch(e){}}
var TOKEN=qs.get('access_token')||localStorage.getItem('miot_token')||'';
if(qs.get('access_token')){ try{localStorage.setItem('miot_token',TOKEN);sessionStorage.setItem('miot_token',TOKEN)}catch(e){} }
var P='/api/v1/jsplugin/miot';
// 本页与 songloft 同源，token 失效时可直接自动登录重新获取，彻底摆脱对 URL 参数的依赖
async function ensureToken(){
  // 先用现有 token 试一次
  if(TOKEN){
    try{var r=await fetch(authUrl(P+'/playlists')); if(r.ok) return true}catch(e){}
  }
  // 重新登录
  try{
    var r=await fetch(BRIDGE+'/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:'admin',password:'admin'})});
    var j=await r.json();
    if(j.access_token){TOKEN=j.access_token;try{localStorage.setItem('miot_token',TOKEN);sessionStorage.setItem('miot_token',TOKEN)}catch(e){};return true}
  }catch(e){}
  return false;
}
var ACC='1227787407';
var DEV='af46e8bc-904b-459a-b333-cc400c9b6eca';
var CURRENT_PL=4;           // 当前显示的歌单
var GUARD=0;                // 视图切换后的短暂防误触时间戳
var SONGS=[];               // 当前歌单歌曲
var STATUS=null;           // 播放器状态
var PLAYLISTS=[];           // 所有歌单
var dragging=false;

function authUrl(u){return BRIDGE+u+(u.indexOf('?')>=0?'&':'?')+'access_token='+encodeURIComponent(TOKEN)}
async function api(path,opts){
  opts=opts||{};
  var url=authUrl(P+path);
  var init={method:opts.method||'GET',headers:{'Content-Type':'application/json'}};
  if(opts.body) init.body=JSON.stringify(opts.body);
  try{
    var r=await fetch(url,init);
    var j=await r.json();
    return j;
  }catch(e){return {success:false,error:String(e)}}
}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},1800)}
function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function parseTitle(t){
  // "01 歌名 - 歌手" → {no,title,artist}
  t=String(t||'');
  var m=t.match(/^(\d+)[\s.、]+(.*)$/);
  var no=m?m[1]:'';var rest=m?m[2]:t;
  var a=rest.split(/\s+-\s+/);
  var title=a[0].trim();var artist=a.length>1?a.slice(1).join(' - ').trim():'';
  return {no:no,title:title,artist:artist};
}
function coverUrl(u){return u?authUrl(u):''}

/* ============ 窄屏侧栏抽屉 ============ */
function closeSideDrawer(){
  var s=document.querySelector('.side'),m=document.getElementById('sideMask');
  if(s)s.classList.remove('open');
  if(m)m.classList.remove('show');
}
document.getElementById('btnMenu').onclick=function(){
  var s=document.querySelector('.side'),m=document.getElementById('sideMask');
  s.classList.toggle('open');m.classList.toggle('show',s.classList.contains('open'));
};
document.getElementById('sideMask').onclick=closeSideDrawer;

/* ============ 歌单侧栏 ============ */
async function loadPlaylists(){
  var r=await api('/playlists');
  if(!r.success){showOffline();return}
  PLAYLISTS=r.data||[];
  var box=document.getElementById('sidePlaylists');box.innerHTML='';
  var dbox=document.getElementById('sideDiscover');dbox.innerHTML='';
  PLAYLISTS.forEach(function(pl){
    var isDisc=(pl.name||'').indexOf('发现 · ')===0;
    var d=document.createElement('div');
    d.className='side-item'+(pl.id===CURRENT_PL?' active':'');
    d.setAttribute('data-pl',pl.id);
    if(isDisc)d.setAttribute('data-disc','1');
    d.innerHTML='<span class="pl-ico"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(pl.name.replace(/^发现 · /,''))+'</span><span class="cnt">'+(pl.song_count||0)+'</span>';
    d.onclick=function(){selectPlaylist(pl.id)};
    (isDisc?dbox:box).appendChild(d);
  });
  document.getElementById('sideDiscoverSec').style.display=dbox.children.length?'':'none';
}

/* ============ 视图历史（顶部后退/前进） ============ */
var HIST=[], HPOS=-1;
function syncNav(){
  var b=document.querySelectorAll('.nav-arrows button');
  if(b.length<2)return;
  b[0].disabled=HPOS<=0;
  b[1].disabled=HPOS>=HIST.length-1;
  b[0].style.opacity=b[0].disabled?0.3:1;
  b[1].style.opacity=b[1].disabled?0.3:1;
  b[0].style.cursor=b[0].disabled?'default':'pointer';
  b[1].style.cursor=b[1].disabled?'default':'pointer';
}
function recView(v){
  if(HPOS>=0&&HIST[HPOS]===v)return;
  HIST=HIST.slice(0,HPOS+1);
  HIST.push(v);HPOS=HIST.length-1;
  if(HIST.length>50){HIST=HIST.slice(-50);HPOS=HIST.length-1}
  syncNav();
}
function applyView(v){
  if(v==='discover')showDiscover(true);else selectPlaylist(v,true);
}
document.querySelectorAll('.nav-arrows button')[0].onclick=function(){if(HPOS>0){HPOS--;applyView(HIST[HPOS]);syncNav()}};
document.querySelectorAll('.nav-arrows button')[1].onclick=function(){if(HPOS<HIST.length-1){HPOS++;applyView(HIST[HPOS]);syncNav()}};

/* ============ 歌单详情 ============ */
async function selectPlaylist(id,noHist){
  CURRENT_PL=id;
  closeSideDrawer();
  // 换歌单时清掉上一次的搜索词，否则会以为新歌单是空的
  var sb=document.getElementById('search');
  if(sb&&sb.value){sb.value='';var sh=document.getElementById('searchHint');if(sh)sh.textContent=''}
  GUARD=Date.now()+700;   // 视图刚切换，避免同一次点击"穿透"到下面的歌曲行
  hideDiscover();
  document.getElementById('navDiscover').classList.remove('active');
  document.querySelectorAll('.side-item[data-pl]').forEach(function(e){e.classList.toggle('active',+e.getAttribute('data-pl')===id)});
  if(!noHist)recView(id);
  var pl=PLAYLISTS.find(function(p){return p.id===id});
  if(pl){
    document.getElementById('plName').textContent=pl.name;
    document.getElementById('plCount').textContent='共 '+pl.song_count+' 首';
    var cv=document.getElementById('plCover');
    if(pl.cover_url){cv.src=coverUrl(pl.cover_url);cv.style.display='block'}else{cv.style.display='none'}
  }
  var r=await api('/playlists/'+id+'/songs');
  SONGS=(r.success&&r.data)?r.data:[];
  renderTracks();
}
function renderTracks(){
  var list=document.getElementById('trackList');list.innerHTML='';
  if(SONGS.length===0){list.innerHTML='<div class="empty"><div style="font-size:36px">♪</div><div>这个歌单还没有歌曲</div></div>';return}
  SONGS.forEach(function(s,i){
    var p=parseTitle(s.title);
    var cur=STATUS&&STATUS.current_song&&STATUS.current_song.id===s.id&&STATUS.is_playing;
    var row=document.createElement('div');
    row.className='track'+(cur?' playing':'');
    row.innerHTML=
      '<span class="idx">'+(cur?'<span class="eq"><i></i><i></i><i></i></span>':String(i+1).padStart(2,'0'))+'</span>'+
      '<span class="tname"><span class="tx">'+esc(p.title)+'</span>'+(s.type==='remote'?'<span class="sq">SQ</span>':'')+'</span>'+
      '<span class="artist">'+esc(p.artist||'—')+'</span>'+
      '<span class="dur">'+fmt(s.duration)+'</span>';
    row.ondblclick=function(){playSong(i)};
    row.onclick=function(){if(Date.now()<GUARD)return;playSong(i)};
    list.appendChild(row);
  });
}

/* ============ 播放控制 ============ */
async function playSong(index){
  var s=SONGS[index];if(!s)return;
  toast('正在推送：'+parseTitle(s.title).title);
  var r=await api('/player/play',{method:'POST',body:{
    account_id:ACC,device_id:DEV,playlist_id:CURRENT_PL,
    start_index:index,song_id:s.id,play_mode:STATUS?STATUS.play_mode:'order'
  }});
  if(r.success){setTimeout(refreshStatus,600)}else{toast('播放失败：'+(r.error||'未知错误'))}
}
async function playAll(){if(SONGS.length)playSong(0)}
async function ctrl(path,body){
  var r=await api(path,{method:'POST',body:body||{account_id:ACC,device_id:DEV}});
  if(!r.success)toast((r.error||'操作失败'));
  setTimeout(refreshStatus,400);
  return r;
}
document.getElementById('btnPlayAll').onclick=playAll;
document.getElementById('btnPrev').onclick=function(){ctrl('/player/previous')};
document.getElementById('btnNext').onclick=function(){ctrl('/player/next')};
document.getElementById('btnToggle').onclick=function(){ctrl('/player/toggle')};

/* 播放模式 */
var MODES=[{v:'order',n:'顺序播放',i:'M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z'},
           {v:'loop',n:'列表循环',i:'M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z'},
           {v:'single',n:'单曲循环',i:'M12 5V2L8 6l4 4V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z'},
           {v:'random',n:'随机播放',i:'M17 3l4 4-4 4V8h-3.5l-2.5 3-2.5-3H5V6h3.5L11 9l2.5-3H17V3zM3 15l4 4-4 4v-3h3.5L9 17l2.5 3H21v2h-9.5L9 19l-2.5 3H3v-7zm18-7l-4 4 4 4v-3h-2.5L17 11l-2.5 3H7v2h7.5L17 13l2.5 3H21V8z'}];
function setModeUI(v){
  var m=MODES.find(function(x){return x.v===v})||MODES[0];
  document.getElementById('modeName').textContent=m.n;
  document.getElementById('icoMode').innerHTML='<path d="'+m.i+'"/>';
}
document.getElementById('btnMode').onclick=function(){
  var cur=STATUS?STATUS.play_mode:'order';var i=MODES.findIndex(function(x){return x.v===cur});i=(i+1)%MODES.length;
  var nv=MODES[i].v;
  api('/player/mode',{method:'POST',body:{account_id:ACC,device_id:DEV,play_mode:nv}}).then(function(r){
    if(r.success){setModeUI(nv);if(STATUS)STATUS.play_mode=nv;toast('已切换：'+MODES[i].n)}
    else toast(r.error||'切换失败');
  });
};

/* 进度拖动（鼠标 + 触摸） */
var pg=document.getElementById('progBar');
function evX(e){return (e.touches&&e.touches[0])?e.touches[0].clientX:((e.changedTouches&&e.changedTouches[0])?e.changedTouches[0].clientX:e.clientX)}
function ratioAt(x){var r=pg.getBoundingClientRect();return Math.max(0,Math.min(1,(x-r.left)/r.width))}
function paintAt(x){var f=ratioAt(x);document.getElementById('progFill').style.width=(f*100)+'%';document.getElementById('curTime').textContent=fmt(f*(STATUS?STATUS.duration:0))}
function commitSeek(x){
  var dur=STATUS?STATUS.duration:0;
  if(!dur){toast('这首歌还在读取时长，稍后再拖');return}
  var pos=Math.round(ratioAt(x)*dur);
  api('/player/seek',{method:'POST',body:{account_id:ACC,device_id:DEV,position:pos}}).then(function(r){
    if(r.success){toast('已跳到 '+fmt(pos));setTimeout(refreshStatus,300)}
    else{toast('拖动失败：'+(r.error==='current song does not support seeking'?'这首歌没有时长信息':'未知原因'));refreshStatus()}
  });
}
var _lastSeekAt=0;
function startDrag(e){dragging=true;paintAt(evX(e));if(e.cancelable)e.preventDefault()}
function moveDrag(e){if(!dragging)return;paintAt(evX(e));if(e.cancelable)e.preventDefault()}
function endDrag(e){if(!dragging)return;dragging=false;_lastSeekAt=Date.now();commitSeek(evX(e))}
pg.addEventListener('mousedown',startDrag);
window.addEventListener('mousemove',moveDrag);
window.addEventListener('mouseup',endDrag);
pg.addEventListener('touchstart',startDrag,{passive:false});
pg.addEventListener('touchmove',moveDrag,{passive:false});
pg.addEventListener('touchend',endDrag);
pg.addEventListener('touchcancel',function(){dragging=false;refreshStatus()});
// 兜底：某些环境（或被拦住 mousedown 时）只派发 click
pg.addEventListener('click',function(e){
  if(dragging)return;
  if(Date.now()-_lastSeekAt<250)return;   // 刚刚 mouseup 已经 seek 过
  _lastSeekAt=Date.now();
  paintAt(evX(e));
  commitSeek(evX(e));
});

/* 音量（拖动即时生效，300ms 节流，避免刷爆接口） */
var volEl=document.getElementById('vol');
var volTimer=null, volBusy=false;
function sendVol(){
  volTimer=null; volBusy=true;
  api('/mina/volume',{method:'POST',body:{account_id:ACC,device_id:DEV,volume:+volEl.value}}).then(function(r){
    volBusy=false;
    if(r.success)toast('音量：'+volEl.value);
  });
}
volEl.addEventListener('input',function(){
  if(volTimer)clearTimeout(volTimer);
  volTimer=setTimeout(sendVol,300);
});
volEl.addEventListener('change',function(){ if(!volTimer&&!volBusy)sendVol(); });

/* 收藏 */
document.getElementById('btnHeart').onclick=function(){
  if(!STATUS||!STATUS.current_song)return;
  var id=STATUS.current_song.id;
  api('/player/favorite/status?song_id='+id).then(function(r){
    var fav=r.success&&r.data&&r.data.is_favorited;
    var act=fav?'remove':'add';
    api('/player/favorite/toggle',{method:'POST',body:{song_id:id,action:act}}).then(function(x){
      if(x.success){document.getElementById('btnHeart').classList.toggle('on',!fav);toast(!fav?'已收藏':'已取消收藏')}
    });
  });
};

/* 搜索：歌单页过滤歌曲，发现页过滤歌单卡片 */
document.getElementById('search').addEventListener('input',function(e){
  var q=e.target.value.trim().toLowerCase();
  var dv=document.getElementById('discoverView');
  if(dv&&dv.classList.contains('show')){
    DV_Q=q;
    renderDiscover();
    return;
  }
  var list=document.getElementById('trackList');
  var rows=list.querySelectorAll('.track');
  var shown=0;
  rows.forEach(function(row,i){
    if(!q){row.style.display='';return}
    var s=SONGS[i];if(!s){row.style.display='';return}
    var p=parseTitle(s.title);
    var txt=(s.title+' '+(s.artist||'')+' '+p.artist).toLowerCase();
    var hit=txt.indexOf(q)>=0;
    row.style.display=hit?'':'none';
    if(hit)shown++;
  });
  var hint=document.getElementById('searchHint');
  if(!hint){
    hint=document.createElement('div');hint.id='searchHint';
    hint.style.cssText='padding:14px 0;color:#999;font-size:13px';
    list.parentNode.insertBefore(hint,list.nextSibling);
  }
  if(!q){hint.textContent='';}
  else if(shown===0){hint.textContent='当前歌单里没找到「'+e.target.value.trim()+'」。搜索只针对当前歌单，换个歌单再试。';}
  else{hint.textContent='当前歌单内找到 '+shown+' 首';}
});

/* 播放列表抽屉 */
document.getElementById('btnList').onclick=function(){renderDrawer();document.getElementById('drawer').classList.add('open')};
document.getElementById('btnCloseDrawer').onclick=function(){document.getElementById('drawer').classList.remove('open')};
// 点抽屉外面也能关
document.addEventListener('click',function(e){
  var dr=document.getElementById('drawer');
  if(!dr||!dr.classList.contains('open'))return;
  if(dr.contains(e.target))return;
  if(e.target.closest&&e.target.closest('#btnList'))return;
  dr.classList.remove('open');
});
function renderDrawer(){
  var d=document.getElementById('drawerList');d.innerHTML='';
  document.getElementById('drawerSub').textContent=SONGS.length+' 首';
  SONGS.forEach(function(s,i){
    var p=parseTitle(s.title);
    var cur=STATUS&&STATUS.current_song&&STATUS.current_song.id===s.id;
    var it=document.createElement('div');it.className='ditem'+(cur?' playing':'');
    it.innerHTML='<span class="dn">'+esc(p.title)+'</span><span class="dd">'+fmt(s.duration)+'</span>';
    it.onclick=function(){playSong(i)};
    d.appendChild(it);
  });
}

/* ============ 状态同步 ============ */
async function refreshStatus(){
  var r=await api('/player/status?account_id='+ACC+'&device_id='+DEV);
  if(!r.success||!r.data)return;
  STATUS=r.data;
  var st=STATUS;
  // 底部信息
  var cs=st.current_song||{};var p=parseTitle(cs.title);
  document.getElementById('barTitle').textContent=p.title||'未在播放';
  document.getElementById('barArtist').textContent=p.artist||(st.state==='playing'?'正在播放':'已暂停');
  if(cs.cover_url)document.getElementById('barCover').src=coverUrl(cs.cover_url);
  // 播放/暂停图标
  document.getElementById('icoPlay').innerHTML=st.is_playing?'<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>':'<path d="M8 5v14l11-7z"/>';
  // 进度
  if(!dragging){
    var pct=st.duration>0?Math.min(100,st.position/st.duration*100):0;
    document.getElementById('progFill').style.width=pct+'%';
    document.getElementById('curTime').textContent=fmt(st.position);
    document.getElementById('totTime').textContent=fmt(st.duration);
  }
  if(!volTimer&&!volBusy) document.getElementById('vol').value=st.volume!=null?st.volume:50;
  setModeUI(st.play_mode);
  // 音箱名
  if(st.device_name)document.getElementById('spkName').textContent=st.device_name;
  // 高亮当前行
  document.querySelectorAll('.track').forEach(function(row,i){row.classList.toggle('playing',!!(cs.id&&SONGS[i]&&SONGS[i].id===cs.id&&st.is_playing))});
}

function showOffline(extra){
  document.getElementById('offline').classList.add('show');
  document.getElementById('offurl').textContent=BRIDGE+P+'/static/goto.html';
}
function failAll(msg){toast(msg);showOffline()}

/* ============ 添加网易云歌单 ============ */
var addJobId=null, addTimer=null;
var addModal=document.getElementById('addModal');
function openAddModal(){
  addModal.classList.add('show');
  document.getElementById('addUrl').value='';
  document.getElementById('importProg').classList.remove('show');
  document.getElementById('importRes').classList.remove('show');
  var go=document.getElementById('addGo'); go.disabled=false; go.textContent='开始导入';
  setTimeout(function(){document.getElementById('addUrl').focus()},120);
}
function closeAddModal(){
  // 不清轮询：导入在后台继续跑完，完成时自动刷新歌单，避免"关了就当取消了"
  addModal.classList.remove('show');
  if(addTimer) toast('导入在后台继续，完成后会出现在「我的歌单」');
}
async function startImport(){
  var url=document.getElementById('addUrl').value.trim();
  if(!url){toast('请先粘贴网易云歌单链接');return}
  var go=document.getElementById('addGo');
  go.disabled=true; go.textContent='导入中…';
  document.getElementById('importProg').classList.add('show');
  document.getElementById('importRes').classList.remove('show');
  document.getElementById('progStage').textContent='正在解析歌单…';
  document.getElementById('impFill').style.width='4%';
  try{
    var r=await fetch(BRIDGE+'/local/import-playlist',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:url})
    });
    var j=await r.json();
    if(!j.ok) throw new Error(j.error||'提交失败');
    addJobId=j.job_id;
    pollImport();
  }catch(e){
    go.disabled=false; go.textContent='重试';
    document.getElementById('progStage').textContent='连接本机服务失败：'+e.message;
  }
}
function pollImport(){
  if(addTimer) clearInterval(addTimer);
  addTimer=setInterval(async function(){
    try{
      var r=await fetch(BRIDGE+'/local/import-status?job_id='+addJobId);
      var j=await r.json();
      if(!j.ok) return;
      var pct=j.total?Math.round((j.done||0)/j.total*100):6;
      document.getElementById('impFill').style.width=Math.max(pct,4)+'%';
      document.getElementById('progStage').textContent=j.stage||'处理中…';
      if(j.status==='done'){
        clearInterval(addTimer); addTimer=null;
        var go=document.getElementById('addGo'); go.disabled=false; go.textContent='再添一个';
        var res=j.result||{};
        var box=document.getElementById('importRes'); box.classList.add('show');
        var h='<div class="ok">✓ 已导入《'+esc(res.name||'')+'》</div>';
        h+='<div>下载成功 '+res.downloaded+' 首 · 歌单现有 '+res.added+' 首</div>';
        if(res.failed&&res.failed.length){
          h+='<div class="bad">'+res.failed.length+' 首没拿到：</div><div class="fail-list">';
          for(var i=0;i<res.failed.length;i++){
            h+='<div>· '+esc(res.failed[i].name)+'（'+esc(res.failed[i].reason)+'）</div>';
          }
          h+='</div>';
        }
        box.innerHTML=h;
        await loadPlaylists();
        if(res.playlist_id) selectPlaylist(res.playlist_id);
        toast('歌单已加入：'+(res.name||''));
      }else if(j.status==='error'){
        clearInterval(addTimer); addTimer=null;
        var g2=document.getElementById('addGo'); g2.disabled=false; g2.textContent='重试';
        var b=document.getElementById('importRes'); b.classList.add('show');
        b.innerHTML='<div class="bad">导入失败：'+esc(j.error||'未知错误')+'</div>';
      }
    }catch(e){}
  },1500);
}
document.getElementById('btnAddPl').onclick=openAddModal;
document.getElementById('addGo').onclick=startImport;
document.getElementById('addClose').onclick=closeAddModal;
document.getElementById('addCancel').onclick=closeAddModal;
addModal.onclick=function(e){if(e.target===addModal)closeAddModal()};
document.getElementById('addUrl').addEventListener('keydown',function(e){
  if(e.key==='Enter') startImport();
});

/* ============ 发现音乐 ============ */
var DISCOVER=[], DV_CAT='全部', DV_Q='', dvLoaded=false;

function fmtNum(n){
  n=+n||0;
  if(n>=100000000) return (n/100000000).toFixed(1)+'亿';
  if(n>=10000) return Math.round(n/10000)+'万';
  return String(n);
}
function showDiscover(noHist){
  closeSideDrawer();
  document.getElementById('discoverView').classList.add('show');
  document.querySelector('.detail').style.display='none';
  document.querySelector('.tracks').style.display='none';
  document.getElementById('navDiscover').classList.add('active');
  document.querySelectorAll('.side-item[data-pl]').forEach(function(e){e.classList.remove('active')});
  if(!noHist)recView('discover');
  if(!dvLoaded) loadDiscover(false);
}
function hideDiscover(){
  var dv=document.getElementById('discoverView');
  if(!dv) return;
  dv.classList.remove('show');
  document.querySelector('.detail').style.display='';
  document.querySelector('.tracks').style.display='';
}
async function loadDiscover(refresh){
  var sub=document.getElementById('dvSub');
  if(refresh) document.getElementById('dvGrid').innerHTML='';
  sub.textContent='正在加载热门歌单…';
  document.getElementById('dvEmpty').style.display='none';
  try{
    var r=await fetch(BRIDGE+'/local/discover'+(refresh?'?refresh=1':''));
    var j=await r.json();
    if(!j.ok) throw new Error(j.error||'加载失败');
    DISCOVER=j.playlists||[];
    dvLoaded=true;
    sub.textContent='共 '+DISCOVER.length+' 个热门歌单 · 来自网易云，点封面直接播到小爱（不下载）';
    renderCats();renderDiscover();
  }catch(e){
    sub.textContent='连不上本机音乐服务';
    var em=document.getElementById('dvEmpty');
    em.style.display='block';
    em.innerHTML='请确认电脑上的「小爱音乐台」服务正在运行（开机自启已包含）。<br>错误：'+esc(e.message||'');
  }
}
function renderCats(){
  var box=document.getElementById('dvCats');
  var cats=['全部'];
  DISCOVER.forEach(function(p){if(p.cat&&p.cat!=='全部'&&cats.indexOf(p.cat)<0)cats.push(p.cat)});
  box.innerHTML='';
  cats.forEach(function(c){
    var d=document.createElement('div');
    d.className='dv-cat'+(c===DV_CAT?' on':'');
    d.textContent=c;
    d.onclick=function(){DV_CAT=c;renderCats();renderDiscover()};
    box.appendChild(d);
  });
}
function renderDiscover(){
  var grid=document.getElementById('dvGrid');grid.innerHTML='';
  var q=(DV_Q||'').trim().toLowerCase();
  var list=DISCOVER.filter(function(p){
    if(DV_CAT!=='全部'&&p.cat!==DV_CAT)return false;
    if(q&&(p.name||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  var sub=document.getElementById('dvSub');
  if(sub){
    if(q){sub.textContent='「'+DV_Q.trim()+'」匹配到 '+list.length+' 个歌单';}
    else{sub.textContent='共 '+DISCOVER.length+' 个热门歌单 · 来自网易云，点封面直接播到小爱（不下载）';}
  }
  var emp=document.getElementById('dvEmpty');
  if(list.length===0&&emp){emp.style.display='';emp.textContent=q?'没有匹配「'+DV_Q.trim()+'」的歌单':'这个分类暂时没有歌单'}
  else if(emp){emp.style.display='none'}
  list.forEach(function(p){
    var c=document.createElement('div');
    c.className='dv-card';
    c.innerHTML='<div class="dv-cover"><img loading="lazy" src="'+esc(p.cover||'')+'" alt=""><span class="ply">▶</span></div>'+
      '<div class="dv-name" title="'+esc(p.name)+'">'+esc(p.name)+'</div>'+
      '<div class="dv-meta">'+fmtNum(p.play_count)+' 次播放 · '+(p.track_count||0)+' 首</div>';
    c.onclick=function(){openDiscoverPl(p,c)};
    grid.appendChild(c);
  });
}
async function openDiscoverPl(p,card){
  if(card&&card.classList.contains('loading'))return;
  if(card)card.classList.add('loading');
  try{
    var r=await fetch(BRIDGE+'/local/discover/play',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:p.id,name:p.name})
    });
    var j=await r.json();
    if(!j.ok) throw new Error(j.error||'准备失败');
    hideDiscover();
    await loadPlaylists();
    await selectPlaylist(j.playlist_id);
    toast('《'+j.name+'》'+j.count+' 首已就绪，点歌播到小爱');
  }catch(e){
    toast('打开失败：'+(e.message||''));
  }finally{
    if(card)card.classList.remove('loading');
  }
}
document.getElementById('navDiscover').onclick=showDiscover;
document.getElementById('dvRefresh').onclick=function(){toast('正在换一批…');loadDiscover(true)};

/* ============ 桥接地址设置 ============ */
document.getElementById('btnBridge').onclick=function(){
  var v=prompt('本机桥接地址（一般不用改；换电脑/换网络时填运行服务的那台电脑的IP）:',BRIDGE);
  if(v){v=v.replace(/\/+$/,'');try{localStorage.setItem('xiaomi_bridge',v)}catch(e){}location.href=location.pathname+'?bridge='+encodeURIComponent(v)}
};
document.getElementById('btnBridge').title='当前桥接: '+BRIDGE;

/* ============ 启动 ============ */
(async function init(){
  var ok=await ensureToken();
  if(!ok||!TOKEN){showOffline('无法自动登录');return}
  // 心跳探测
  var r=await api('/playlists');
  if(!r.success){showOffline();return}
  document.getElementById('offline').classList.remove('show');
  await loadPlaylists();
  // 默认选中：优先上次的歌单，不存在就落到第一个有歌的歌单
  if(!PLAYLISTS.some(function(p){return p.id===CURRENT_PL})){
    var first=PLAYLISTS.filter(function(p){return (p.song_count||0)>0})[0]||PLAYLISTS[0];
    CURRENT_PL=first?first.id:null;
  }
  if(location.hash==='#discover'||!CURRENT_PL){
    showDiscover();
  }else{
    await selectPlaylist(CURRENT_PL);
  }
  await refreshStatus();
  setInterval(refreshStatus,1500);
})();
</script>
